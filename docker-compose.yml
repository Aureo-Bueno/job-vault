x-app: &app
  build: .
  image: job-vault-app
  volumes:
    - .:/var/www/html
  environment:
    DB_HOST: ${DB_HOST:-mysql}
    DB_PORT: ${DB_PORT:-3306}
    DB_USER: ${DB_USER:-appuser}
    DB_PASSWORD: ${DB_PASSWORD:-app_password}
    DB_NAME: ${DB_NAME:-myapp_db}
  networks:
    - app_network

services:
  # One-shot job: applies pending migrations (schema + seeds) and exits.
  migrate:
    <<: *app
    container_name: php_migrate
    command: ["php", "bin/migrate", "migrate"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  php:
    <<: *app
    container_name: php_app
    restart: always
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Long-running worker for scheduled jobs (closes vacancies past their deadline).
  # Interval in seconds: SCHEDULER_INTERVAL (default 3600).
  scheduler:
    <<: *app
    container_name: php_scheduler
    command: ["php", "bin/console", "schedule:work"]
    restart: always
    # The php:apache base image stops with SIGWINCH (graceful Apache), which PHP CLI
    # ignores. Use SIGTERM, forwarded by tini (PID 1), so `docker compose stop` is immediate.
    init: true
    stop_signal: SIGTERM
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
      DB_NAME: ${DB_NAME:-myapp_db}
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-3600}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mysql:
    image: mysql:8.0
    container_name: mysql_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-myapp_db}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # Use MySQL 8 default auth (caching_sha2_password) to avoid deprecation warning
    networks:
      - app_network
    healthcheck:
      # TCP ping: the temporary init server only listens on the socket, so this
      # only passes once the real server (with the app user created) is up.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 20s
      retries: 20

volumes:
  mysql_data:
    driver: local

networks:
  app_network:
    driver: bridge
